# The packaged game entry point is "Index.html" (capital I), so nginx's
# default lowercase index lookup is replaced explicitly and any unknown path
# falls back to the game page.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index Index.html;

  location / {
    try_files $uri $uri/ /Index.html;
  }
}
