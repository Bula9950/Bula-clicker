# Base44 sandbox/dev environment for the Bula clicker TurboWarp build.
#
# The app is a single self-contained static file (Index.html): the game's
# project data is embedded in the page, so there is no build step, no backend,
# no database and no external credentials. nginx serves the repo file straight
# from the bind mount, so an edit to Index.html shows up on reload.
#
# BASE44_PREVIEW_MODE=1 swaps the served entry point to .base44/preview.html, a
# pass-through shell that boots the game in a blob iframe. That is needed only
# because the preview harness injects markup into every literal "<head>" in an
# app's HTML source, including the ones inside the game's bundled JavaScript,
# which breaks the bundle. With the flag unset the app is served exactly as it
# ships (Index.html at /).
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    environment:
      - BASE44_PREVIEW_MODE
    command:
      - sh
      - -ec
      - |
        if [ "$${BASE44_PREVIEW_MODE}" = "1" ]; then entry=preview.html; else entry=Index.html; fi
        echo "serving $$entry at /"
        sed "s|__ENTRY__|$$entry|g" /etc/nginx/default.conf.template > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      # Served straight from the checkout (read-only): no prebuilt bundle.
      # Files are mounted individually because the sandbox checkout's top
      # directory is not traversable by nginx's unprivileged worker user.
      - ./Index.html:/usr/share/nginx/html/Index.html:ro
      - ./.base44/preview.html:/usr/share/nginx/html/preview.html:ro
      - ./.base44/default.conf.template:/etc/nginx/default.conf.template:ro
    labels:
      base44.project: "Bula clicker"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
